name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # SportsClubApi.Tests references SportsClubApi as a ProjectReference, so
      # pointing dotnet at the test project builds both - there's no .sln to
      # target instead.
      - name: Restore
        run: dotnet restore backend/SportsClubApi.Tests/SportsClubApi.Tests.csproj

      # `dotnet format` skips a referenced project when pointed at just one
      # csproj, so both SportsClubApi and SportsClubApi.Tests are checked
      # explicitly here to cover the whole backend.
      - name: Check formatting (backend)
        run: |
          dotnet format backend/SportsClubApi/SportsClubApi.csproj --verify-no-changes
          dotnet format backend/SportsClubApi.Tests/SportsClubApi.Tests.csproj --verify-no-changes

      - name: Build
        run: dotnet build backend/SportsClubApi.Tests/SportsClubApi.Tests.csproj --no-restore --configuration Release

      # Smoke tests: the few existing tests that cover the core path (log in,
      # call a protected endpoint with the token, get refused without one).
      # They are tagged [Trait("Category", "Smoke")] in the test project and run
      # first so a broken core flow fails the build fast, before the full suite.
      - name: Smoke tests
        run: >
          dotnet test backend/SportsClubApi.Tests/SportsClubApi.Tests.csproj
          --no-build --configuration Release
          --filter "Category=Smoke"

      - name: Test with coverage
        run: >
          dotnet test backend/SportsClubApi.Tests/SportsClubApi.Tests.csproj
          --no-build --configuration Release
          --logger "console;verbosity=normal"
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage

      # coverlet.collector (referenced by SportsClubApi.Tests) writes a Cobertura
      # XML report per run under ./coverage - turn it into a plain-text summary
      # so coverage shows up directly in the workflow log, not just as a raw XML
      # artifact nobody opens.
      #
      # Excluded from the numbers (code the tests aren't meant to cover):
      #   SportsClubApi.Migrations.*          generated EF Core migrations
      #   SportsClubApi.Data.DbSeeder         startup seeding of default accounts
      #   SportsClubApi.Data.DemoDataSeeder   sample data, skipped on the test DB
      #   Program                             app startup / wiring
      # Without this filter the report counts them and line coverage reads ~22%.
      #
      # Quality gate: the step fails if line coverage (after the exclusions
      # above) is below COVERAGE_MIN_LINE percent.
      - name: Summarize coverage
        if: always()
        env:
          COVERAGE_MIN_LINE: 85
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          reportgenerator \
            -reports:./coverage/**/coverage.cobertura.xml \
            -targetdir:./coverage/report \
            -reporttypes:TextSummary \
            "-classfilters:-SportsClubApi.Migrations.*;-SportsClubApi.Data.DbSeeder;-SportsClubApi.Data.DemoDataSeeder;-Program"
          cat ./coverage/report/Summary.txt | tee -a "$GITHUB_STEP_SUMMARY"

          line=$(grep -m1 "Line coverage:" ./coverage/report/Summary.txt | grep -oE "[0-9]+(\.[0-9]+)?")
          if awk -v v="$line" -v min="$COVERAGE_MIN_LINE" 'BEGIN { exit !(v + 0 >= min + 0) }'; then
            echo "Line coverage ${line}% meets the ${COVERAGE_MIN_LINE}% minimum." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Line coverage ${line}% is below the ${COVERAGE_MIN_LINE}% minimum." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      # The task that named this step asked for "frontend/sports-club-web" -
      # this repo's frontend lives at "frontend" instead, so that's what's
      # checked. `npm run lint` runs oxlint (see frontend/package.json), which
      # serves the same purpose here as ESLint would.
      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
