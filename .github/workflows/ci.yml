name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # SportsClubApi.Tests references SportsClubApi as a ProjectReference, so
      # pointing dotnet at the test project builds both - there's no .sln to
      # target instead.
      - name: Restore
        run: dotnet restore backend/SportsClubApi.Tests/SportsClubApi.Tests.csproj

      - name: Build
        run: dotnet build backend/SportsClubApi.Tests/SportsClubApi.Tests.csproj --no-restore --configuration Release

      - name: Test
        run: dotnet test backend/SportsClubApi.Tests/SportsClubApi.Tests.csproj --no-build --configuration Release --logger "console;verbosity=normal"
